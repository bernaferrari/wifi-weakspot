name: Publish web demo

# Builds the Kotlin/Wasm demo (the real app UI with simulated Wi-Fi) and publishes it to
# GitHub Pages. Enable Pages once in the repository settings: Settings → Pages → Source:
# "GitHub Actions". The demo is then live at https://<user>.github.io/<repository>/.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle
      # The Android modules share the build, so Gradle needs the SDK to configure them.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2'
      - name: Build the web demo
        run: ./gradlew :webDemo:wasmJsBrowserDistribution --stacktrace
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: webDemo/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
